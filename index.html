<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bridal Pearson — Product Leader, Builder, Writer</title>
  <meta name="description" content="Bridal Pearson is a product leader and builder passionate about understanding people, uncovering opportunities, and turning ideas into experiences that create lasting value." />
  <meta property="og:title" content="Bridal Pearson — Product Leader, Builder, Writer" />
  <meta property="og:description" content="Building products that earn a place in people's lives." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080a0f;
    --bg2: #0d1117;
    --bg3: #111520;
    --border: rgba(255,255,255,0.07);
    --border-bright: rgba(255,255,255,0.14);
    --text: #e8eaf0;
    --text2: #8890a4;
    --text3: #555d72;
    --accent: #7c9fff;
    --accent2: #a78bfa;
    --gold: #c9a96e;
    --glow: rgba(124,159,255,0.15);
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

  /* Progress bar */
  .progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    z-index: 1000;
    transition: width 0.1s linear;
  }

  /* Nav */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 48px;
    border-bottom: 1px solid transparent;
    transition: all 0.3s ease;
  }
  .nav.scrolled {
    background: rgba(8,10,15,0.88);
    backdrop-filter: blur(20px);
    border-bottom-color: var(--border);
  }
  .nav-logo {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--text);
  }
  .nav-logo span { color: var(--accent); }
  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }
  .nav-links a {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--text2);
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--text); }
  .nav-cta {
    font-size: 13px;
    padding: 8px 20px;
    border: 1px solid var(--border-bright);
    border-radius: 40px;
    color: var(--text);
    background: transparent;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--sans);
    letter-spacing: 0.03em;
  }
  .nav-cta:hover {
    background: rgba(124,159,255,0.1);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Hero */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 120px 24px 80px;
    position: relative;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,159,255,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 80%, rgba(167,139,250,0.06) 0%, transparent 50%),
      radial-gradient(ellipse 40% 30% at 10% 60%, rgba(201,169,110,0.04) 0%, transparent 50%);
    pointer-events: none;
  }
  .hero-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 40%, black 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-eyebrow {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 24px;
    opacity: 0.8;
  }
  .hero-headline {
    font-family: var(--serif);
    font-size: clamp(2.8rem, 6vw, 5.5rem);
    font-weight: 300;
    line-height: 1.1;
    letter-spacing: -0.02em;
    max-width: 900px;
    color: var(--text);
    margin-bottom: 20px;
  }
  .hero-headline em {
    font-style: italic;
    color: var(--accent);
  }
  .hero-sub {
    font-size: clamp(1rem, 1.5vw, 1.2rem);
    color: var(--accent2);
    font-family: var(--serif);
    font-style: italic;
    font-weight: 300;
    margin-bottom: 32px;
    letter-spacing: 0.01em;
  }
  .hero-body {
    font-size: 15px;
    color: var(--text2);
    max-width: 600px;
    line-height: 1.8;
    margin-bottom: 48px;
    font-weight: 300;
  }
  .hero-btns {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-primary {
    padding: 12px 28px;
    background: var(--accent);
    color: #080a0f;
    border: none;
    border-radius: 40px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary:hover {
    background: #a3baff;
    transform: translateY(-1px);
    box-shadow: 0 8px 30px rgba(124,159,255,0.3);
  }
  .btn-ghost {
    padding: 12px 28px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border-bright);
    border-radius: 40px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-ghost:hover {
    border-color: var(--text2);
    transform: translateY(-1px);
  }
  .scroll-indicator {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--text3);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, var(--text3), transparent);
    animation: scrollPulse 2s ease-in-out infinite;
  }
  @keyframes scrollPulse {
    0%, 100% { opacity: 0.3; transform: scaleY(0.6); }
    50% { opacity: 1; transform: scaleY(1); }
  }
  .orbs {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    animation: orbFloat 12s ease-in-out infinite;
  }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0); }
    33% { transform: translate(20px, -30px); }
    66% { transform: translate(-15px, 20px); }
  }

  /* Section base */
  section {
    padding: 100px 24px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .section-label {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    display: block;
  }
  .section-title {
    font-family: var(--serif);
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 300;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.15;
    margin-bottom: 16px;
  }
  .section-desc {
    font-size: 15px;
    color: var(--text2);
    max-width: 560px;
    line-height: 1.8;
    font-weight: 300;
  }
  .divider {
    width: 100%;
    height: 1px;
    background: var(--border);
    margin: 0;
  }

  /* Process / How I Think */
  .process-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1px;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-top: 64px;
  }
  .process-card {
    padding: 36px 32px;
    background: var(--bg2);
    position: relative;
    transition: background 0.3s;
  }
  .process-card:hover { background: var(--bg3); }
  .process-num {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--text3);
    margin-bottom: 16px;
    font-family: var(--sans);
  }
  .process-step {
    font-family: var(--serif);
    font-size: 1.5rem;
    font-weight: 300;
    color: var(--text);
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }
  .process-desc {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.7;
    font-weight: 300;
  }
  .process-accent {
    position: absolute;
    top: 20px; right: 24px;
    font-size: 24px;
    color: var(--accent);
    opacity: 0.2;
  }

  /* Metrics */
  .metrics-section {
    background: var(--bg2);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    max-width: 100%;
    padding: 80px 48px;
  }
  .metrics-inner {
    max-width: 1200px;
    margin: 0 auto;
  }
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 40px;
    margin-top: 48px;
  }
  .metric-card {
    text-align: center;
    padding: 32px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    transition: border-color 0.3s, transform 0.3s;
  }
  .metric-card:hover {
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: 0 20px 40px rgba(124,159,255,0.08);
  }
  .metric-value {
    font-family: var(--serif);
    font-size: 2.2rem;
    font-weight: 300;
    color: var(--text);
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .metric-label {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.5;
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  /* Notebook */
  .notebook-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 48px;
  }
  .notebook-card {
    padding: 32px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
  }
  .notebook-card:hover {
    border-color: var(--border-bright);
    transform: translateY(-3px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.3);
  }
  .notebook-date {
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.1em;
    margin-bottom: 16px;
  }
  .notebook-title {
    font-family: var(--serif);
    font-size: 1.1rem;
    font-weight: 400;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .notebook-body {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.8;
    font-weight: 300;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .notebook-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 20px;
  }
  .tag {
    font-size: 10px;
    padding: 3px 10px;
    border: 1px solid var(--border-bright);
    border-radius: 20px;
    color: var(--text3);
    letter-spacing: 0.08em;
    transition: all 0.2s;
  }
  .tag:hover { border-color: var(--accent); color: var(--accent); }

  /* Companies */
  .companies-list {
    margin-top: 64px;
    display: flex;
    flex-direction: column;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .company-row {
    display: grid;
    grid-template-columns: 1fr 2fr auto;
    gap: 48px;
    align-items: start;
    padding: 48px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    transition: background 0.3s;
  }
  .company-row:last-child { border-bottom: none; }
  .company-row:hover { background: var(--bg3); }
  .company-name {
    font-family: var(--serif);
    font-size: 1.5rem;
    font-weight: 300;
    color: var(--text);
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .company-role {
    font-size: 12px;
    color: var(--text3);
    letter-spacing: 0.08em;
  }
  .company-desc {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.8;
    font-weight: 300;
  }
  .company-tags {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-end;
    min-width: 120px;
  }
  .company-tag {
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(124,159,255,0.08);
    color: var(--accent);
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  /* Case studies */
  .cases-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
    margin-top: 48px;
  }
  .case-card {
    padding: 40px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: all 0.3s;
  }
  .case-card:hover {
    border-color: var(--border-bright);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .case-title {
    font-family: var(--serif);
    font-size: 1.2rem;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 28px;
    letter-spacing: -0.01em;
  }
  .case-row { margin-bottom: 20px; }
  .case-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 6px;
  }
  .case-text {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.7;
    font-weight: 300;
  }
  .case-outcome {
    font-family: var(--serif);
    font-size: 1rem;
    font-weight: 400;
    color: var(--text);
    font-style: italic;
    line-height: 1.5;
  }

  /* Experiments */
  .experiments-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    margin-top: 48px;
  }
  .exp-card {
    padding: 36px 32px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .exp-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .exp-card:hover { border-color: var(--border-bright); transform: translateY(-3px); }
  .exp-card:hover::before { opacity: 1; }
  .exp-status {
    display: inline-block;
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(124,159,255,0.1);
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-bottom: 20px;
  }
  .exp-name {
    font-family: var(--serif);
    font-size: 1.2rem;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .exp-desc {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.8;
    font-weight: 300;
  }
  .exp-tag {
    position: absolute;
    bottom: 20px; right: 20px;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.1em;
  }

  /* Writing */
  .writing-featured {
    padding: 48px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-top: 48px;
    margin-bottom: 24px;
    transition: all 0.3s;
  }
  .writing-featured:hover { border-color: var(--border-bright); }
  .writing-featured-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 20px;
  }
  .writing-title {
    font-family: var(--serif);
    font-size: clamp(1.3rem, 2vw, 1.8rem);
    font-weight: 300;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1.3;
    margin-bottom: 16px;
  }
  .writing-excerpt {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.8;
    font-weight: 300;
    max-width: 600px;
    margin-bottom: 24px;
  }
  .writing-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 12px;
    color: var(--text3);
  }
  .writing-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .writing-card {
    padding: 28px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: all 0.3s;
  }
  .writing-card:hover {
    border-color: var(--border-bright);
    transform: translateY(-2px);
  }

  /* Now */
  .now-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    margin-top: 64px;
  }
  .now-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .now-item {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
  }
  .now-icon {
    color: var(--accent);
    font-size: 14px;
    margin-top: 3px;
    flex-shrink: 0;
  }
  .now-text {
    font-size: 15px;
    color: var(--text2);
    line-height: 1.6;
    font-weight: 300;
  }
  .beyond-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 24px;
  }
  .beyond-tag {
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 40px;
    font-size: 13px;
    color: var(--text2);
    transition: all 0.2s;
    cursor: default;
  }
  .beyond-tag:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(124,159,255,0.05);
  }

  /* Connect */
  .connect-section {
    text-align: center;
    padding: 120px 24px;
  }
  .connect-links {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 48px;
    flex-wrap: wrap;
  }
  .connect-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 32px;
    border: 1px solid var(--border-bright);
    border-radius: 40px;
    font-size: 14px;
    color: var(--text);
    transition: all 0.2s;
  }
  .connect-link:hover {
    border-color: var(--accent);
    background: rgba(124,159,255,0.07);
    transform: translateY(-2px);
  }

  /* Footer */
  footer {
    padding: 40px 48px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text3);
  }

  /* Mobile hamburger */
  .hamburger {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text);
    font-size: 20px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .nav { padding: 16px 24px; }
    .nav-links { display: none; }
    .nav-cta { display: none; }
    .hamburger { display: block; }
    .company-row { grid-template-columns: 1fr; gap: 16px; }
    .company-tags { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
    .now-grid { grid-template-columns: 1fr; gap: 48px; }
    section { padding: 64px 24px; }
    .metrics-section { padding: 64px 24px; }
    footer { flex-direction: column; gap: 16px; text-align: center; }
  }

  </style>
</head>
<body>
  <div id="root"></div>

const { useState, useEffect, useRef } = React;



// ─── Utility: useInView hook ──────────────────────────────────────────────────
function useInView(threshold = 0.15) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) setInView(true); },
      { threshold }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

// ─── useScrollProgress ───────────────────────────────────────────────────────
function useScrollProgress() {
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const el = document.documentElement;
      setProgress(el.scrollTop / (el.scrollHeight - el.clientHeight));
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return progress;
}

// ─── Animated reveal wrapper ──────────────────────────────────────────────────
function Reveal({ children, delay = 0, className = "" }) {
  const [ref, inView] = useInView();
  return (
    <div
      ref={ref}
      className={className}
      style={{
        opacity: inView ? 1 : 0,
        transform: inView ? "translateY(0)" : "translateY(32px)",
        transition: `opacity 0.75s ease ${delay}s, transform 0.75s ease ${delay}s`,
      }}
    >
      {children}
    </div>
  );
}

// ── Helpers for Medium RSS ────────────────────────────────────────────────────
function estimateReadTime(content = "") {
  const words = content.replace(/<[^>]*>/g, "").split(/\s+/).filter(Boolean).length;
  return `${Math.max(1, Math.round(words / 200))} min read`;
}

function stripHtml(html = "") {
  return html.replace(/<[^>]*>/g, "").replace(/&[a-z]+;/gi, " ").trim();
}

function extractThumb(content = "") {
  const match = content.match(/<img[^>]+src="([^"]+)"/);
  return match ? match[1] : null;
}

function inferTag(title = "", content = "") {
  const text = (title + " " + content).toLowerCase();
  if (text.includes("ai") || text.includes("artificial")) return "AI";
  if (text.includes("product") || text.includes("pm ") || text.includes("roadmap")) return "Product Thinking";
  if (text.includes("market") || text.includes("marketplace")) return "Marketplaces";
  if (text.includes("growth") || text.includes("loyalty") || text.includes("engagement")) return "Growth";
  if (text.includes("story") || text.includes("narrative") || text.includes("writing")) return "Storytelling";
  if (text.includes("focus") || text.includes("leader") || text.includes("team")) return "Leadership";
  if (text.includes("cook") || text.includes("gym") || text.includes("fitness")) return "Life & Work";
  return "Product Strategy";
}

function WritingSection() {

        .then((r) => r.json())
        .then((data) => {

            const mapped = data.items.map((item) => ({
              title: item.title || "",

              readTime: estimateReadTime(item.content || item.description || ""),

            setArticles(mapped);
